<!DOCTYPE html>
<html lang="ko">
<head>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0d141c">
    <link rel="apple-touch-icon" href="logo.png">
    <link rel="shortcut icon" href="logo.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FC 수지사랑 Point Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body { font-family: 'Pretendard', sans-serif; background-color: #f1f5f9; color: #334155; margin: 0; }
        
        /* [수정] 로그인 화면: 상하 여백 추가 및 한 화면 구성 */
        #login-screen {
            position: fixed; inset: 0; z-index: 1000;
            background: #0d141c;
            display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
            padding: 40px 20px; /* 상하 여백 넉넉히 주어 잘림 방지 */
            overflow-y: auto;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.98);
            padding: 24px; border-radius: 28px;
            width: 100%; max-width: 360px; text-align: center; margin-bottom: 24px;
        }

        /* 전광판 디자인 유지 */
        .scoreboard {
            width: 100%; max-width: 360px; 
            background-color: #050a0f;
            background-image: radial-gradient(#1e293b 1px, transparent 0);
            background-size: 8px 8px; border-radius: 16px; padding: 20px;
            border: 4px solid #1e293b; color: white;
            margin-bottom: 12px;
        }
        .sb-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; border-bottom: 1px solid #1e293b; padding-bottom: 8px; }
        .sb-dot { color: #ff4d4d; margin-right: 6px; }
        .sb-title { color: #10b981; font-weight: 900; font-size: 14px; }
        .sb-date { color: #94a3b8; font-size: 14px; font-weight: 700; }
        .sb-row { display: flex; margin-bottom: 10px; font-size: 15px; }
        .sb-label { width: 60px; color: #94a3b8; font-weight: 800; }
        .sb-val { flex: 1; color: #ffffff; font-weight: 800; }

        /* 수정 폼 스타일 */
        #edit-form-panel { width: 100%; max-width: 360px; background: #1e293b; padding: 15px; border-radius: 12px; margin-top: 10px; }
        .edit-input { background: #0d141c; border: 1px solid #334155; color: #10b981; padding: 6px 10px; border-radius: 6px; font-size: 12px; width: 100%; margin-bottom: 6px; }

        #main-app { min-height: 100vh; background-color: #f1f5f9; }
        .app-title-main {
            font-size: 20px; font-weight: 900; font-style: italic;
            background: linear-gradient(90deg, #065f46 0%, #10b981 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .filter-btn { background: white; border-radius: 10px; font-size: 12px; font-weight: 700; color: #64748b; border: 1px solid #e2e8f0; }
        .filter-btn.active { background: #059669; color: white; border-color: #059669; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="pb-10">

    <section id="login-screen">
        <div class="login-card shadow-2xl">
            <img src="logo.png" alt="Logo" class="w-14 h-14 mx-auto mb-2">
            <h1 class="app-title-main">FC 수지사랑</h1>
            <p class="text-[9px] font-black text-slate-400 tracking-[0.2em] mb-4">POINT MANAGER</p>
            <div class="space-y-2">
                <input type="password" id="pw-input" inputmode="numeric" placeholder="접속 암호를 입력하세요" 
                    class="w-full h-11 bg-slate-100 rounded-xl text-center font-bold border-2 border-slate-200 focus:border-emerald-500 outline-none">
                <button onclick="checkPassword()" class="w-full h-11 bg-emerald-600 text-white rounded-xl font-black text-sm shadow-md active:scale-95 transition-all">관리자 접속</button>
                
                <button onclick="location.href='member/position.html'" class="w-full h-11 bg-white border-2 border-emerald-600 text-emerald-600 rounded-xl font-black text-sm flex items-center justify-center gap-2">
                    <span>🏟️</span> 전술판 바로가기
                </button>
                
                <p id="error-msg" class="text-red-500 text-[10px] font-bold opacity-0 transition-opacity">비밀번호가 일치하지 않습니다.</p>
            </div>
        </div>

        <div class="scoreboard">
            <div class="sb-header">
                <div class="flex items-center"><span class="sb-dot">●</span><span class="sb-title">MATCH INFO</span></div>
                <span id="sb-date-top" class="sb-date">...</span>
            </div>
            <div class="sb-row"><div class="sb-label">장소</div><div class="sb-val" id="sb-loc">: -</div></div>
            <div class="sb-row"><div class="sb-label">시간</div><div class="sb-val" id="sb-time">: -</div></div>
            <div class="sb-row"><div class="sb-label">상대팀</div><div class="sb-val" id="sb-opp">: -</div></div>
        </div>

        <button onclick="toggleEditPanel()" class="text-slate-500 text-xs font-bold underline mb-2">경기 정보 수정</button>
        
        <div id="edit-form-panel" class="hidden">
            <div class="grid grid-cols-2 gap-2">
                <input type="text" id="ed-date" placeholder="날짜" class="edit-input">
                <input type="text" id="ed-loc" placeholder="장소" class="edit-input">
                <input type="text" id="ed-time" placeholder="시간" class="edit-input">
                <input type="text" id="ed-opp" placeholder="상대팀" class="edit-input">
            </div>
            <button onclick="updateSchedule()" class="w-full mt-2 py-2 bg-emerald-700 text-white text-[11px] rounded-lg font-bold">저장하기</button>
        </div>
    </section>

    <div id="main-app" class="hidden">
        <header class="sticky top-0 z-50 bg-white/95 border-b p-4 shadow-sm">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-lg font-black text-emerald-600 italic">FC SUJI MANAGER</h2>
                <div class="flex gap-1">
                    <button onclick="addMember()" class="bg-emerald-600 text-white px-3 py-1.5 rounded-lg text-[10px] font-black">추가</button>
                    <button onclick="deleteMember()" class="bg-slate-800 text-white px-3 py-1.5 rounded-lg text-[10px] font-black">삭제</button>
                </div>
            </div>
            <div class="space-y-2">
                <div class="grid grid-cols-4 gap-1.5" id="q-wrap">
                    <button onclick="selectQ(1)" id="q1" class="filter-btn h-9">1분기</button>
                    <button onclick="selectQ(2)" id="q2" class="filter-btn h-9">2분기</button>
                    <button onclick="selectQ(3)" id="q3" class="filter-btn h-9">3분기</button>
                    <button onclick="selectQ(4)" id="q4" class="filter-btn h-9">4분기</button>
                </div>
                <div id="m-wrap" class="grid grid-cols-3 gap-1.5"></div>
                <div id="w-wrap" class="flex gap-2 overflow-x-auto pb-1 no-scrollbar"></div>
            </div>
        </header>
        <main class="p-4">
            <div id="view-title" class="text-[11px] font-bold text-slate-400 mb-4 px-1"></div>
            <div id="list-container" class="space-y-3"></div>
        </main>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAVvQNQaLlxu9Bp_vVGKNzkdN5QRN8n8-Y",
            authDomain: "fc-sujilove.firebaseapp.com",
            databaseURL: "https://fc-sujilove-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "fc-sujilove",
            storageBucket: "fc-sujilove.firebasestorage.app",
            messagingSenderId: "157843616872",
            appId: "1:157843616872:web:d9703b157d93166cb177dd"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        
        let members = []; let pData = {}; let sched = {};
        let selQ = 1, selM = 1, selW = 1;

        db.ref('fc_suji_v9').on('value', (snap) => {
            const data = snap.val() || {};
            members = data.members || [];
            pData = data.points || {};
            sched = data.schedule || { date: '미정', loc: '미정', time: '미정', opp: '미정' };
            updateScheduleUI();
            render();
        });

        function checkPassword() {
            if(document.getElementById('pw-input').value === '2026') {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('main-app').classList.remove('hidden');
                selectQ(1);
            } else {
                const msg = document.getElementById('error-msg');
                msg.style.opacity = '1';
                setTimeout(() => msg.style.opacity = '0', 2000);
            }
        }

        function toggleEditPanel() {
            const panel = document.getElementById('edit-form-panel');
            panel.classList.toggle('hidden');
        }

        function updateSchedule() {
            const newSched = {
                date: document.getElementById('ed-date').value || sched.date,
                loc: document.getElementById('ed-loc').value || sched.loc,
                time: document.getElementById('ed-time').value || sched.time,
                opp: document.getElementById('ed-opp').value || sched.opp
            };
            db.ref('fc_suji_v9/schedule').set(newSched).then(() => {
                alert('일정이 저장되었습니다.');
                toggleEditPanel();
            });
        }

        function updateScheduleUI() {
            document.getElementById('sb-date-top').innerText = sched.date;
            document.getElementById('sb-loc').innerText = ': ' + sched.loc;
            document.getElementById('sb-time').innerText = ': ' + sched.time;
            document.getElementById('sb-opp').innerText = ': ' + sched.opp;
        }

        // 기존 포인트 로직 (유지)
        function selectQ(q) {
            selQ = q; updateBtnUI('q-wrap', `q${q}`);
            const ms = q === 1 ? [1,2,3] : q === 2 ? [4,5,6] : q === 3 ? [7,8,9] : [10,11,12];
            document.getElementById('m-wrap').innerHTML = ms.map(m => `<button onclick="selectM(${m})" id="m${m}" class="filter-btn h-9">${m}월</button>`).join('');
            selectM(ms[0]);
        }
        function selectM(m) {
            selM = m; updateBtnUI('m-wrap', `m${m}`);
            document.getElementById('w-wrap').innerHTML = [1,2,3,4,5].map(w => `<button onclick="selectW(${w})" id="w${w}" class="filter-btn min-w-[60px] h-8 text-[11px]">${w}주차</button>`).join('');
            selectW(1);
        }
        function selectW(w) {
            selW = w; updateBtnUI('w-wrap', `w${w}`);
            document.getElementById('view-title').innerText = `● 2026년 ${selQ}분기 ${selM}월 ${selW}주차 현황`;
            render();
        }
        function updateBtnUI(pid, aid) {
            document.querySelectorAll(`#${pid} button`).forEach(b => b.classList.toggle('active', b.id === aid));
        }

        function getCumScore(mid) {
            let total = 0;
            const ms = selQ === 1 ? [1,2,3] : selQ === 2 ? [4,5,6] : selQ === 3 ? [7,8,9] : [10,11,12];
            for (let m of ms) {
                if (m > selM) break;
                for (let w = 1; w <= 5; w++) {
                    if (m === selM && w > selW) break;
                    const k = `${selQ}-${m}-${w}-${mid}`;
                    if (pData[k]) total += (Number(pData[k].a) || 0) + (Number(pData[k].t) || 0);
                }
            }
            return total;
        }

        function render() {
            const container = document.getElementById('list-container');
            if(!container) return;
            const sorted = [...members].sort((a,b) => getCumScore(b.id) - getCumScore(a.id));
            container.innerHTML = sorted.map((m, i) => {
                const cum = getCumScore(m.id);
                const cur = pData[`${selQ}-${selM}-${selW}-${m.id}`] || {a:0, t:0};
                const medal = cum >= 21 ? '🥇' : cum >= 11 ? '🥈' : '🥉';
                return `
                <div class="bg-white p-4 rounded-2xl flex items-center justify-between shadow-sm border border-slate-100">
                    <div class="flex items-center gap-3">
                        <span class="text-xl">${medal}</span>
                        <div>
                            <div class="text-base font-black text-slate-800">${m.name}</div>
                            <div class="text-[11px] font-bold text-indigo-600">${cum}P 누적</div>
                        </div>
                    </div>
                    <div class="flex gap-2">
                        <button onclick="toggleAttend(${m.id})" class="w-14 h-12 rounded-xl font-black text-[11px] ${cur.a===3 ? 'bg-blue-600 text-white shadow-lg' : 'bg-slate-100 text-slate-400'}">참석</button>
                        <div class="flex flex-col items-center bg-emerald-50 px-2 py-1 rounded-xl border border-emerald-100">
                            <div class="flex items-center gap-2">
                                <button onclick="changeTrain(${m.id},-1)" class="w-6 h-6 flex items-center justify-center bg-white rounded shadow-sm text-slate-400">-</button>
                                <span class="text-xs font-black w-4 text-center">${cur.t || 0}</span>
                                <button onclick="changeTrain(${m.id},1)" class="w-6 h-6 flex items-center justify-center bg-white rounded shadow-sm text-emerald-600">+</button>
                            </div>
                        </div>
                    </div>
                </div>`;
            }).join('');
        }

        function toggleAttend(mid) {
            const k = `${selQ}-${selM}-${selW}-${mid}`;
            if(!pData[k]) pData[k] = {a:0, t:0};
            pData[k].a = (pData[k].a === 3) ? 0 : 3;
            db.ref('fc_suji_v9/points').set(pData);
        }
        function changeTrain(mid, v) {
            const k = `${selQ}-${selM}-${selW}-${mid}`;
            if(!pData[k]) pData[k] = {a:0, t:0};
            if((pData[k].t || 0) + v >= 0) {
                pData[k].t = (pData[k].t || 0) + v;
                db.ref('fc_suji_v9/points').set(pData);
            }
        }
        function addMember() { const n = prompt('이름:'); if(n) { members.push({id: Date.now(), name: n}); db.ref('fc_suji_v9/members').set(members); } }
        function deleteMember() { const n = prompt('삭제할 이름:'); if(n) { members = members.filter(m => m.name !== n); db.ref('fc_suji_v9/members').set(members); } }
    </script>
</body>
</html>
