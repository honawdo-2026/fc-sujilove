<!DOCTYPE html>
<html lang="ko">
<head>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#065f46">
    <link rel="apple-touch-icon" href="logo.png">
    <link rel="shortcut icon" href="logo.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FC 수지사랑 Point Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body { font-family: 'Pretendard', sans-serif; background-color: #f1f5f9; color: #334155; margin: 0; }
        
        #login-screen {
            position: fixed; inset: 0; z-index: 1000;
            background: linear-gradient(135deg, #065f46 0%, #064e3b 100%);
            display: flex; align-items: center; justify-content: center;
            overflow-y: auto; padding: 20px 0;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(10px); padding: 28px 20px; border-radius: 32px;
            width: 90%; max-width: 380px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            text-align: center; z-index: 10;
        }

        /* 전광판 디자인 */
        .scoreboard {
            width: 100%; background-color: #050a0f;
            background-image: radial-gradient(#1e293b 1px, transparent 0);
            background-size: 6px 6px; border-radius: 20px; padding: 18px;
            border: 3px solid #1e293b; color: white; text-align: left;
            margin: 18px 0 0px; /* 아래쪽 여백 제거 */
        }
        .sb-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; border-bottom: 1px solid #1e293b; padding-bottom: 8px; }
        .sb-dot { color: #ff4d4d; margin-right: 6px; }
        .sb-title { color: #10b981; font-weight: 900; font-size: 13px; letter-spacing: 0.1em; }
        .sb-date { color: #ffffff; font-size: 14px; font-weight: 800; }
        .sb-row { display: flex; margin-bottom: 8px; font-size: 15px; }
        .sb-label { width: 60px; color: #94a3b8; font-weight: 800; }
        .sb-val { flex: 1; color: #ffffff; font-weight: 800; text-align: right; }

        /* [수정] 전광판 조금 아래에 위치한 수정 버튼 */
        .edit-text-btn {
            display: block; margin: 8px 0 12px auto; /* 전광판 아래, 우측 정렬 */
            background: #6366f1; color: white; padding: 5px 12px;
            border-radius: 8px; font-size: 11px; font-weight: 800;
            box-shadow: 0 4px 10px rgba(99, 102, 241, 0.2); transition: all 0.2s;
        }

        /* 정보 수정 폼 디자인 */
        .edit-panel { background: #f8faff; border-radius: 20px; padding: 14px; margin: 10px 0 15px; text-align: left; }
        .edit-group { display: grid; grid-template-cols: 1fr 1fr; gap: 8px; }
        .edit-label { font-size: 10px; font-weight: 800; color: #94a3b8; margin-bottom: 3px; padding-left: 2px; }
        .edit-input { 
            background: white; border: 1px solid #e2e8f0; color: #334155; 
            padding: 8px 12px; border-radius: 10px; font-size: 12px; font-weight: 700; width: 100%;
        }
        .edit-submit { 
            background: #6366f1; color: white; border-radius: 10px; 
            font-weight: 900; font-size: 12px; height: 36px; margin-top: 8px; width: 100%;
        }

        .app-logo { width: 60px; height: 60px; object-fit: contain; margin: 0 auto 10px; }
        .app-title-main {
            font-size: 18px; font-weight: 900; font-style: italic;
            background: linear-gradient(90deg, #065f46 0%, #10b981 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        #main-app { min-height: 100vh; background-color: #f1f5f9; }
        .filter-btn { background: white; border-radius: 12px; font-size: 12px; font-weight: 700; color: #64748b; border: 1px solid #e2e8f0; }
        .q-btn.active { background: #2563eb; color: white; border-color: #2563eb; }
        .m-btn.active { background: #4f46e5; color: white; border-color: #4f46e5; }
        .w-btn.active { background: #0d9488; color: white; border-color: #0d9488; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="pb-32">

    <section id="login-screen">
        <div class="login-card">
            <img src="logo.png" alt="Logo" class="app-logo">
            <h1 class="app-title-main">FC 수지사랑</h1>
            <p class="text-[8px] font-black text-slate-400 uppercase tracking-[0.2em]">Point Manager System</p>

            <div class="scoreboard">
                <div class="sb-header">
                    <div class="flex items-center"><span class="sb-dot">●</span><span class="sb-title">MATCH INFO</span></div>
                    <span id="sb-date-top" class="sb-date">-</span>
                </div>
                <div class="sb-row"><div class="sb-label">장소</div><div class="sb-val" id="sb-loc">-</div></div>
                <div class="sb-row"><div class="sb-label">시간</div><div class="sb-val" id="sb-time">-</div></div>
                <div class="sb-row"><div class="sb-label">상대팀</div><div class="sb-val" id="sb-opp">-</div></div>
            </div>

            <button onclick="toggleEdit()" class="edit-text-btn active:scale-95">
                경기 정보 수정
            </button>

            <div id="edit-form" class="hidden edit-panel shadow-inner">
                <div class="edit-group mb-2">
                    <div><div class="edit-label">날짜</div><input type="text" id="ed-date" class="edit-input"></div>
                    <div><div class="edit-label">시간</div><input type="text" id="ed-time" class="edit-input"></div>
                </div>
                <div class="edit-group">
                    <div><div class="edit-label">장소</div><input type="text" id="ed-loc" class="edit-input"></div>
                    <div><div class="edit-label">상대팀</div><input type="text" id="ed-opp" class="edit-input"></div>
                </div>
                <button onclick="updateSchedule()" class="edit-submit active:scale-95">확인</button>
            </div>

            <div class="space-y-2.5 pt-4 border-t border-slate-100">
                <input type="password" id="pw-input" inputmode="numeric" placeholder="접속 암호 입력" 
                    class="w-full h-11 bg-slate-100 rounded-xl text-center text-base font-bold border-2 border-transparent focus:border-emerald-500 outline-none transition-all">
                
                <button onclick="checkPassword()" class="w-full h-11 bg-emerald-600 text-white rounded-xl font-black text-sm shadow-md active:scale-95 transition-all">관리자 접속</button>
                
                <button onclick="location.href='member/position.html'" class="w-full h-11 bg-white text-emerald-700 border-2 border-emerald-600 rounded-xl font-black text-sm flex items-center justify-center gap-2 transition-all">
                    🏟️ 전술판 바로가기
                </button>
                
                <p id="error-msg" class="text-red-500 text-[10px] font-bold opacity-0 transition-opacity">비밀번호가 일치하지 않습니다.</p>
            </div>
        </div>
    </section>

    <div id="main-app" class="hidden">
        <header class="sticky top-0 z-50 bg-white/75 backdrop-blur-xl border-b p-4 space-y-4">
            <div class="flex justify-between items-center">
                <h2 class="app-title-main text-sm text-emerald-600 italic uppercase">Manager Mode</h2>
                <div class="flex gap-1">
                    <button onclick="addMember()" class="text-[10px] bg-emerald-600 text-white px-3 py-1.5 rounded-full font-black">추가</button>
                    <button onclick="deleteMember()" class="text-[10px] bg-slate-800 text-white px-3 py-1.5 rounded-full font-black">삭제</button>
                </div>
            </div>
            <div class="space-y-2">
                <div class="grid grid-cols-4 gap-1.5" id="q-wrap">
                    <button onclick="selectQ(1)" id="q1" class="filter-btn q-btn h-9">1분기</button>
                    <button onclick="selectQ(2)" id="q2" class="filter-btn q-btn h-9">2분기</button>
                    <button onclick="selectQ(3)" id="q3" class="filter-btn q-btn h-9">3분기</button>
                    <button onclick="selectQ(4)" id="q4" class="filter-btn q-btn h-9">4분기</button>
                </div>
                <div id="m-wrap" class="grid grid-cols-3 gap-1.5"></div>
                <div id="w-wrap" class="flex gap-2 overflow-x-auto pb-1 no-scrollbar"></div>
            </div>
        </header>
        <main class="p-4"><div id="list-container" class="space-y-3"></div></main>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAVvQNQaLlxu9Bp_vVGKNzkdN5QRN8n8-Y",
            authDomain: "fc-sujilove.firebaseapp.com",
            databaseURL: "https://fc-sujilove-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "fc-sujilove",
            storageBucket: "fc-sujilove.firebasestorage.app",
            messagingSenderId: "157843616872",
            appId: "1:157843616872:web:d9703b157d93166cb177dd"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        let members = []; let pData = {}; let sched = {}; let selQ = 1, selM = 1, selW = 1;
        const SEASON_YEAR = new Date().getFullYear();

        // 해당 연/월의 일요일 날짜 목록 반환 (예: 2026년 7월 -> [5, 12, 19, 26])
        function getSundays(year, month) {
            const dates = [];
            const daysInMonth = new Date(year, month, 0).getDate();
            for (let d = 1; d <= daysInMonth; d++) {
                if (new Date(year, month - 1, d).getDay() === 0) dates.push(d);
            }
            return dates;
        }

        db.ref('fc_suji_v9').on('value', (snap) => {
            const data = snap.val() || {};
            members = data.members || [];
            pData = data.points || {};
            sched = data.schedule || { date: '미정', loc: '미정', time: '미정', opp: '미정' };
            updateUI();
        });

        function updateUI() {
            document.getElementById('sb-date-top').innerText = sched.date;
            document.getElementById('sb-loc').innerText = sched.loc;
            document.getElementById('sb-time').innerText = sched.time;
            document.getElementById('sb-opp').innerText = sched.opp;
            render();
        }

        function toggleEdit() { document.getElementById('edit-form').classList.toggle('hidden'); }

        function updateSchedule() {
            const newSched = {
                date: document.getElementById('ed-date').value || sched.date,
                time: document.getElementById('ed-time').value || sched.time,
                loc: document.getElementById('ed-loc').value || sched.loc,
                opp: document.getElementById('ed-opp').value || sched.opp
            };
            db.ref('fc_suji_v9/schedule').set(newSched).then(() => { toggleEdit(); });
        }

        function checkPassword() {
            if(document.getElementById('pw-input').value === '2026') {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('main-app').classList.remove('hidden');
                selectQ(1);
            } else {
                document.getElementById('error-msg').style.opacity = '1';
                setTimeout(() => { document.getElementById('error-msg').style.opacity = '0'; }, 2000);
            }
        }

        function selectQ(q) {
            selQ = q; updateBtnUI('q-wrap', `q${q}`);
            const ms = q === 1 ? [1,2,3] : q === 2 ? [4,5,6] : q === 3 ? [7,8,9] : [10,11,12];
            document.getElementById('m-wrap').innerHTML = ms.map(m => `<button onclick="selectM(${m})" id="m${m}" class="filter-btn m-btn h-9">${m}월</button>`).join('');
            selectM(ms[0]);
        }
        function selectM(m) {
            selM = m; updateBtnUI('m-wrap', `m${m}`);
            const sundays = getSundays(SEASON_YEAR, m);
            document.getElementById('w-wrap').innerHTML = sundays.map((d, i) => {
                const w = i + 1;
                return `<button onclick="selectW(${w})" id="w${w}" class="filter-btn w-btn min-w-[60px] h-8 text-[11px]">${d}일</button>`;
            }).join('');
            selectW(1);
        }
        function selectW(w) { selW = w; updateBtnUI('w-wrap', `w${w}`); render(); }
        function updateBtnUI(pid, aid) { document.querySelectorAll(`#${pid} button`).forEach(b => b.classList.toggle('active', b.id === aid)); }

        function getCumScore(mid) {
            let total = 0;
            const ms = selQ === 1 ? [1,2,3] : selQ === 2 ? [4,5,6] : selQ === 3 ? [7,8,9] : [10,11,12];
            for (let m of ms) { if (m > selM) break; for (let w = 1; w <= 5; w++) { if (m === selM && w > selW) break; const k = `${selQ}-${m}-${w}-${mid}`; if (pData[k]) total += (Number(pData[k].a) || 0) + (Number(pData[k].t) || 0); } }
            return total;
        }

        function render() {
            const container = document.getElementById('list-container');
            if (!container) return;
            const sorted = [...members].sort((a,b) => getCumScore(b.id) - getCumScore(a.id));
            container.innerHTML = sorted.map(m => {
                const cum = getCumScore(m.id);
                const cur = pData[`${selQ}-${selM}-${selW}-${m.id}`] || {a:0, t:0};
                const medal = cum >= 21 ? '🥇' : cum >= 11 ? '🥈' : '🥉';
                return `
                <div class="bg-white p-4 rounded-2xl flex items-center justify-between shadow-sm border border-slate-100">
                    <div class="flex items-center gap-3">
                        <span class="text-xl">${medal}</span>
                        <div>
                            <div class="flex items-center gap-2">
                                <span class="text-base font-black text-slate-800">${m.name}</span>
                                <button onclick="editMemberById(${m.id})" class="text-[9px] bg-slate-100 text-slate-500 px-2 py-0.5 rounded-full font-black active:bg-indigo-600 active:text-white">수정</button>
                            </div>
                            <div class="text-[12px] font-bold text-indigo-600">${cum}P 누적</div>
                        </div>
                    </div>
                    <div class="flex gap-2">
                        <button onclick="toggleAttend(${m.id})" class="w-14 h-12 rounded-xl font-black text-[11px] ${cur.a===3 ? 'bg-blue-600 text-white' : 'bg-slate-100 text-slate-400'}">참석</button>
                        <div class="flex flex-col items-center bg-emerald-50 px-2 py-1 rounded-xl">
                            <div class="flex items-center gap-2">
                                <button onclick="changeTrain(${m.id},-1)" class="w-7 h-7 flex items-center justify-center bg-white rounded-lg shadow-sm text-slate-400">-</button>
                                <span class="text-xs font-black w-4 text-center">${cur.t || 0}</span>
                                <button onclick="changeTrain(${m.id},1)" class="w-7 h-7 flex items-center justify-center bg-white rounded-lg shadow-sm text-emerald-600">+</button>
                            </div>
                        </div>
                    </div>
                </div>`;
            }).join('');
        }

        function toggleAttend(mid) {
            const k = `${selQ}-${selM}-${selW}-${mid}`;
            if(!pData[k]) pData[k] = {a:0, t:0};
            pData[k].a = (pData[k].a === 3) ? 0 : 3;
            db.ref('fc_suji_v9/points').set(pData);
        }
        function changeTrain(mid, v) {
            const k = `${selQ}-${selM}-${selW}-${mid}`;
            if(!pData[k]) pData[k] = {a:0, t:0};
            if((pData[k].t || 0) + v >= 0) { pData[k].t = (pData[k].t || 0) + v; db.ref('fc_suji_v9/points').set(pData); }
        }
        function addMember() { const n = prompt('이름:'); if(n) { members.push({id: Date.now(), name: n}); db.ref('fc_suji_v9/members').set(members); } }
        function editMemberById(id) {
            const member = members.find(m => m.id === id);
            if (!member) return;
            const newName = prompt('새 이름을 입력하세요:', member.name);
            if (newName && newName.trim() && newName.trim() !== member.name) {
                member.name = newName.trim();
                db.ref('fc_suji_v9/members').set(members);
            }
        }
        function deleteMember() { const n = prompt('삭제할 이름:'); if(n) { members = members.filter(m => m.name !== n); db.ref('fc_suji_v9/members').set(members); } }
        document.getElementById('pw-input').addEventListener('keypress', (e) => { if(e.key === 'Enter') checkPassword(); });
    </script>
</body>
</html>
