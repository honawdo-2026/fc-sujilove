<!DOCTYPE html>
<html lang="ko">
<head>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#065f46">
    <link rel="apple-touch-icon" href="logo.png">
    <link rel="shortcut icon" href="logo.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FC 수지사랑 Point Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body { font-family: 'Pretendard', sans-serif; background-color: #f1f5f9; color: #334155; margin: 0; }
        
        #login-screen {
            position: fixed; inset: 0; z-index: 1000;
            background: linear-gradient(135deg, #065f46 0%, #064e3b 100%);
            display: flex; align-items: center; justify-content: center;
            overflow-y: auto; padding: 20px 0;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px); padding: 30px 24px; border-radius: 32px;
            width: 90%; max-width: 400px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        /* 전광판 스타일 */
        .match-board {
            background-color: #0d141c;
            background-image: radial-gradient(rgba(255,255,255,0.05) 1px, transparent 1px);
            background-size: 5px 5px;
            border: 4px solid #1e293b;
            border-radius: 24px;
            padding: 20px;
            color: #ffffff;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
            margin-bottom: 15px;
        }
        .match-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 10px;
        }
        .match-info-tag {
            color: #10b981;
            font-weight: 900;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .match-info-tag::before {
            content: '';
            width: 8px;
            height: 8px;
            background: #ff4d4d;
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 10px #ff4d4d;
        }
        .board-body {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .board-row {
            display: flex;
            align-items: baseline;
            justify-content: flex-start;
        }
        .row-label {
            font-size: 12px;
            font-weight: 700;
            color: #64748b; /* 회색 */
            width: 60px;
            flex-shrink: 0;
            text-align: left;
        }
        .row-value {
            flex-grow: 1;
            font-size: 20px;
            font-weight: 900;
            color: #ffffff;
            text-align: center;
            padding-right: 40px; /* 라벨 너비만큼 오른쪽 여백을 주어 실제 중앙 배치 유도 */
        }

        .btn-edit-trigger {
            background: #e2e8f0;
            color: #64748b;
            padding: 12px;
            border-radius: 12px;
            font-weight: 800;
            font-size: 13px;
            width: 100%;
            margin-top: 10px;
        }

        /* 입력 폼 스타일 */
        .input-box-wrap {
            background: #f8fafc;
            padding: 20px;
            border-radius: 20px;
            border: 1px solid #e2e8f0;
            margin-top: 20px;
            text-align: left;
        }
        .input-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
        }
        .label-text {
            width: 50px;
            font-size: 13px;
            font-weight: 800;
            color: #475569;
        }
        .input-el {
            flex: 1;
            height: 42px;
            background: #fff;
            border: 1px solid #cbd5e1;
            border-radius: 12px;
            padding: 0 12px;
            font-size: 14px;
            outline: none;
        }
        .input-el:focus {
            border-color: #10b981;
        }
        .btn-confirm {
            background: #10b981;
            color: white;
            padding: 12px;
            border-radius: 12px;
            font-weight: 800;
            width: 100%;
            transition: all 0.2s;
        }
        .btn-confirm:active {
            transform: scale(0.98);
        }

        /* 기존 스타일 유지 */
        .member-card { background: white; border-radius: 32px; padding: 20px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.05); }
        .q-btn.active { background-color: #065f46 !important; color: white !important; }
        .m-btn.active { background-color: #10b981 !important; color: white !important; border-color: #10b981 !important; }
        .w-btn.active { background-color: #34d399 !important; color: white !important; border-color: #34d399 !important; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="pb-32">

    <section id="login-screen">
        <div class="login-card">
            <div class="mb-8">
                <h1 class="text-3xl font-black text-emerald-800 italic tracking-tighter">FC SUJI SARANG</h1>
                <p class="text-slate-400 font-bold text-xs uppercase tracking-widest mt-1">Point Management System</p>
            </div>

            <div id="auth-area" class="space-y-3 mb-8">
                <input type="password" id="pw-input" inputmode="numeric" placeholder="접속 암호" class="w-full h-16 bg-slate-100 rounded-2xl text-center text-2xl font-bold border-2 border-transparent focus:border-emerald-500 outline-none transition-all">
                <button onclick="checkPassword()" class="w-full h-16 bg-emerald-600 text-white rounded-2xl font-black text-lg shadow-lg shadow-emerald-200">관리자 접속</button>
                <button onclick="location.href='member/position.html'" class="w-full h-16 bg-white text-emerald-700 border-2 border-emerald-700 rounded-2xl font-black text-lg">전술판 바로가기</button>
            </div>

            <hr class="border-slate-100 mb-8">

            <div id="display-area" class="hidden">
                <div class="match-board">
                    <div class="match-header">
                        <div class="match-info-tag">MATCH INFO</div>
                        <div id="view-date" class="text-xs font-bold text-slate-400"></div>
                    </div>
                    <div class="board-body">
                        <div class="board-row">
                            <span class="row-label">장소 :</span>
                            <span id="view-loc" class="row-value"></span>
                        </div>
                        <div class="board-row">
                            <span class="row-label">시간 :</span>
                            <span id="view-time" class="row-value"></span>
                        </div>
                        <div class="board-row">
                            <span class="row-label">상대팀 :</span>
                            <span id="view-opp" class="row-value"></span>
                        </div>
                    </div>
                </div>
                <button onclick="showInputArea()" class="btn-edit-trigger">정보 수정하기</button>
            </div>

            <div id="input-area">
                <div class="input-box-wrap">
                    <h3 class="text-[11px] font-black text-slate-400 mb-4 uppercase tracking-wider">Upcoming Match Schedule</h3>
                    <div class="input-row">
                        <span class="label-text">날짜 :</span>
                        <input type="text" id="sched-date" placeholder="예) 25.03.15" class="input-el">
                    </div>
                    <div class="input-row">
                        <span class="label-text">장소 :</span>
                        <input type="text" id="sched-loc" placeholder="예) 수지체육공원" class="input-el">
                    </div>
                    <div class="input-row">
                        <span class="label-text">시간 :</span>
                        <input type="text" id="sched-time" placeholder="예) 08:00 ~ 12:00" class="input-el">
                    </div>
                    <div class="input-row">
                        <span class="label-text">상대팀 :</span>
                        <input type="text" id="sched-opp" placeholder="예) 수지FC" class="input-el">
                    </div>
                    <button onclick="saveSchedule()" class="btn-confirm">확인</button>
                </div>
            </div>
        </div>
    </section>

    <div id="main-app" class="hidden">
        <header class="p-6 bg-white/80 backdrop-blur-md border-b sticky top-0 z-50">
            <div class="flex justify-between items-end mb-6">
                <div>
                    <h2 class="text-2xl font-black text-slate-800">선수 명단</h2>
                    <p class="text-emerald-600 font-bold text-xs">FC 수지사랑 관리자 모드</p>
                </div>
                <button onclick="addMember()" class="bg-slate-900 text-white px-5 py-2.5 rounded-2xl text-xs font-black shadow-lg">+ 선수 추가</button>
            </div>

            <div id="q-wrap" class="grid grid-cols-4 gap-2 mb-4">
                <button onclick="selectQ(1)" id="q1" class="q-btn h-12 border-2 border-slate-100 rounded-2xl font-black text-sm bg-slate-50 text-slate-400">1분기</button>
                <button onclick="selectQ(2)" id="q2" class="q-btn h-12 border-2 border-slate-100 rounded-2xl font-black text-sm bg-slate-50 text-slate-400">2분기</button>
                <button onclick="selectQ(3)" id="q3" class="q-btn h-12 border-2 border-slate-100 rounded-2xl font-black text-sm bg-slate-50 text-slate-400">3분기</button>
                <button onclick="selectQ(4)" id="q4" class="q-btn h-12 border-2 border-slate-100 rounded-2xl font-black text-sm bg-slate-50 text-slate-400">4분기</button>
            </div>

            <div id="m-wrap" class="flex gap-2 overflow-x-auto pb-2 mb-2 no-scrollbar"></div>
            <div id="w-wrap" class="flex gap-2 overflow-x-auto pb-2 no-scrollbar"></div>
        </header>

        <main id="list-container" class="p-6 space-y-4"></main>
    </div>

    <script>
        // 파이어베이스 설정 (기본값 유지)
        const firebaseConfig = {
            apiKey: "AIzaSyAVvQNQaLlxu9Bp_vVGKNzkdN5QRN8n8-Y",
            authDomain: "fc-sujilove.firebaseapp.com",
            databaseURL: "https://fc-sujilove-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "fc-sujilove",
            storageBucket: "fc-sujilove.firebasestorage.app",
            messagingSenderId: "157843616872",
            appId: "1:157843616872:web:d9703b157d93166cb177dd"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // 1. 경기일정 관련 로직
        window.onload = function() {
            // DB에서 일정 가져오기
            db.ref('schedule').on('value', (snapshot) => {
                const data = snapshot.val();
                if (data) {
                    showDisplayArea(data);
                } else {
                    showInputArea();
                }
            });
        };

        function showInputArea() {
            document.getElementById('input-area').style.display = 'block';
            document.getElementById('display-area').classList.add('hidden');
        }

        function showDisplayArea(data) {
            document.getElementById('view-date').innerText = data.date || '';
            document.getElementById('view-loc').innerText = data.loc || '';
            document.getElementById('view-time').innerText = data.time || '';
            document.getElementById('view-opp').innerText = data.opp || '';
            
            document.getElementById('input-area').style.display = 'none';
            document.getElementById('display-area').classList.remove('hidden');

            // 입력창 초기값 세팅 (수정 시 편의를 위해)
            document.getElementById('sched-date').value = data.date || '';
            document.getElementById('sched-loc').value = data.loc || '';
            document.getElementById('sched-time').value = data.time || '';
            document.getElementById('sched-opp').value = data.opp || '';
        }

        function saveSchedule() {
            const date = document.getElementById('sched-date').value;
            const loc = document.getElementById('sched-loc').value;
            const time = document.getElementById('sched-time').value;
            const opp = document.getElementById('sched-opp').value;

            if(!date || !opp) {
                alert("날짜와 상대팀 정보는 필수입니다.");
                return;
            }

            const scheduleData = {
                date: date,
                loc: loc,
                time: time,
                opp: opp,
                updatedAt: firebase.database.ServerValue.TIMESTAMP
            };

            db.ref('schedule').set(scheduleData)
                .then(() => {
                    alert("경기일정이 저장되었습니다.");
                })
                .catch((error) => {
                    alert("저장 실패: " + error.message);
                });
        }

        // 2. 관리자 접속 로직 (원본 유지)
        function checkPassword() {
            const pw = document.getElementById('pw-input').value;
            if(pw === '2025') {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('main-app').classList.remove('hidden');
                initAdmin();
            } else {
                alert("비밀번호가 틀렸습니다.");
            }
        }

        // --- 이하 원본 관리자 기능들 ---
        let members = [];
        let currentQ = 1, currentM = 1, currentW = 1;

        function initAdmin() {
            db.ref('members').on('value', snap => {
                const val = snap.val();
                members = val ? Object.keys(val).map(id => ({id, ...val[id]})) : [];
                selectQ(1);
            });
        }

        function selectQ(q) {
            currentQ = q;
            document.querySelectorAll('.q-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('q'+q).classList.add('active');
            const months = { 1:[1,2,3], 2:[4,5,6], 3:[7,8,9], 4:[10,11,12] };
            const mWrap = document.getElementById('m-wrap');
            mWrap.innerHTML = months[q].map(m => `
                <button onclick="selectM(${m})" id="m${m}" class="m-btn flex-none px-6 h-12 border-2 border-slate-100 rounded-2xl font-black text-sm bg-white text-slate-400">${m}월</button>
            `).join('');
            selectM(months[q][0]);
        }

        function selectM(m) {
            currentM = m;
            document.querySelectorAll('.m-btn').forEach(b => b.classList.remove('active'));
            if(document.getElementById('m'+m)) document.getElementById('m'+m).classList.add('active');
            const wWrap = document.getElementById('w-wrap');
            wWrap.innerHTML = [1,2,3,4,5].map(w => `
                <button onclick="selectW(${w})" id="w${w}" class="w-btn flex-none px-5 h-10 border-2 border-slate-50 rounded-xl font-black text-[11px] bg-white text-slate-300">${w}주차</button>
            `).join('');
            selectW(1);
        }

        function selectW(w) {
            currentW = w;
            document.querySelectorAll('.w-btn').forEach(b => b.classList.remove('active'));
            if(document.getElementById('w'+w)) document.getElementById('w'+w).classList.add('active');
            db.ref(`attendance/m${currentM}/w${currentW}`).on('value', snap => {
                renderList(snap.val() || {});
            });
        }

        function renderList(attendance) {
            const container = document.getElementById('list-container');
            container.innerHTML = members.map(m => {
                const cur = attendance[m.id] || { a: 0, t: 0 };
                return `
                <div class="member-card">
                    <div class="flex items-center gap-4">
                        <div class="w-14 h-14 bg-emerald-100 rounded-2xl flex items-center justify-center font-black text-emerald-700 text-xl">${m.name[0]}</div>
                        <div>
                            <div class="font-black text-slate-800 text-lg">${m.name}</div>
                            <div class="text-[10px] font-black text-slate-300 uppercase tracking-widest">${m.pos || '선수'}</div>
                        </div>
                    </div>
                    <div class="flex items-center gap-3">
                        <button onclick="toggleAttend('${m.id}', ${cur.a})" class="w-20 h-14 rounded-2xl font-black text-[12px] transition-all ${cur.a === 3 ? 'bg-blue-600 text-white' : 'bg-slate-100 text-slate-400'}">
                            ${cur.a === 3 ? '참 석' : '미 참'}
                        </button>
                        <div class="flex flex-col items-center gap-1 bg-emerald-50 p-2 rounded-2xl border border-emerald-100 min-w-[80px]">
                            <span class="text-[9px] font-black text-emerald-600">훈련</span>
                            <div class="flex items-center gap-2">
                                <button onclick="changeTrain('${m.id}', ${cur.t || 0}, -1)" class="w-8 h-8 flex items-center justify-center bg-white rounded-lg shadow-sm font-bold text-emerald-400">-</button>
                                <span class="w-4 text-center font-black text-emerald-700 text-sm">${cur.t || 0}</span>
                                <button onclick="changeTrain('${m.id}', ${cur.t || 0}, 1)" class="w-8 h-8 flex items-center justify-center bg-white rounded-lg shadow-sm font-bold text-emerald-600">+</button>
                            </div>
                        </div>
                    </div>
                </div>`;
            }).join('');
        }

        function toggleAttend(id, current) {
            const next = current === 3 ? 0 : 3;
            db.ref(`attendance/m${currentM}/w${currentW}/${id}/a`).set(next);
        }

        function changeTrain(id, current, delta) {
            const next = Math.max(0, current + delta);
            db.ref(`attendance/m${currentM}/w${currentW}/${id}/t`).set(next);
        }

        function addMember() {
            const name = prompt("새 선수 이름을 입력하세요:");
            if(name) db.ref('members').push({ name, pos: '선수' });
        }
    </script>
</body>
</html>
