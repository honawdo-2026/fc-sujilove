<!DOCTYPE html>
<html lang="ko">
<head>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#065f46">
    <link rel="apple-touch-icon" href="logo.png">
    <link rel="shortcut icon" href="logo.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FC 수지사랑 Point Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body { font-family: 'Pretendard', sans-serif; background-color: #f1f5f9; color: #334155; margin: 0; }
        
        #login-screen {
            position: fixed; inset: 0; z-index: 1000;
            background: linear-gradient(135deg, #065f46 0%, #064e3b 100%);
            display: flex; align-items: center; justify-content: center;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px); padding: 30px 24px; border-radius: 32px;
            width: 90%; max-width: 400px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        /* 전광판 */
        .match-board {
            background-color: #0d141c; padding: 20px; border-radius: 24px; color: #ffffff;
            border: 4px solid #1e293b; margin-bottom: 15px;
        }
        .board-row { display: flex; align-items: baseline; margin-bottom: 5px; }
        .row-label { font-size: 12px; color: #64748b; width: 60px; }
        .row-value { font-size: 18px; font-weight: 900; flex-grow: 1; text-align: center; }

        /* 멤버 카드 및 메달 */
        .member-card { background: white; border-radius: 24px; padding: 16px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
        .medal-icon { font-size: 20px; margin-right: 5px; }
        .point-badge { background: #f1f5f9; color: #475569; padding: 2px 8px; border-radius: 8px; font-size: 11px; font-weight: 900; margin-top: 2px; }

        /* 탭 스타일 */
        .q-btn.active { background-color: #065f46 !important; color: white !important; }
        .m-btn.active { background-color: #10b981 !important; color: white !important; }
        .w-btn.active { background-color: #34d399 !important; color: white !important; }
        
        .delete-btn { display: none; }
        .delete-mode .delete-btn { display: block; }
    </style>
</head>
<body class="pb-32">

    <section id="login-screen">
        <div class="login-card">
            <h1 class="text-2xl font-black text-emerald-800 mb-6 italic">FC SUJI SARANG</h1>
            <div class="space-y-3 mb-6">
                <input type="password" id="pw-input" inputmode="numeric" placeholder="접속 암호" class="w-full h-14 bg-slate-100 rounded-2xl text-center text-xl font-bold border-2 border-transparent focus:border-emerald-500 outline-none">
                <button onclick="checkPassword()" class="w-full h-14 bg-emerald-600 text-white rounded-2xl font-black text-lg">관리자 접속</button>
            </div>
            <div id="display-area">
                <div class="match-board">
                    <div class="board-row"><span class="row-label">장소 :</span><span id="view-loc" class="row-value">-</span></div>
                    <div class="board-row"><span class="row-label">시간 :</span><span id="view-time" class="row-value">-</span></div>
                    <div class="board-row"><span class="row-label">상대 :</span><span id="view-opp" class="row-value">-</span></div>
                </div>
                <button onclick="toggleInputArea()" class="w-full py-3 bg-slate-200 rounded-xl text-sm font-bold text-slate-500">정보 수정하기</button>
            </div>
            <div id="input-area" class="hidden mt-4 text-left p-4 bg-white rounded-2xl border">
                <input type="text" id="sched-date" placeholder="날짜" class="w-full border p-2 mb-2 rounded">
                <input type="text" id="sched-loc" placeholder="장소" class="w-full border p-2 mb-2 rounded">
                <input type="text" id="sched-time" placeholder="시간" class="w-full border p-2 mb-2 rounded">
                <input type="text" id="sched-opp" placeholder="상대팀" class="w-full border p-2 mb-2 rounded">
                <button onclick="saveSchedule()" class="w-full py-3 bg-emerald-500 text-white rounded-xl font-bold">저장</button>
            </div>
        </div>
    </section>

    <div id="main-app" class="hidden">
        <header class="p-4 bg-white border-b sticky top-0 z-50">
            <div class="flex justify-between items-center mb-4">
                <span class="font-black text-emerald-600 text-xl">관리자 모드</span>
                <div class="flex gap-2">
                    <button onclick="toggleDeleteMode()" class="bg-slate-100 text-slate-500 px-3 py-2 rounded-full text-xs font-bold">선수삭제</button>
                    <button onclick="addMember()" class="bg-emerald-600 text-white px-3 py-2 rounded-full text-xs font-bold">+ 선수추가</button>
                </div>
            </div>
            <div id="q-wrap" class="grid grid-cols-4 gap-2 mb-2">
                <button onclick="selectQ(1)" id="q1" class="q-btn h-10 border rounded-xl font-bold text-xs">1분기</button>
                <button onclick="selectQ(2)" id="q2" class="q-btn h-10 border rounded-xl font-bold text-xs">2분기</button>
                <button onclick="selectQ(3)" id="q3" class="q-btn h-10 border rounded-xl font-bold text-xs">3분기</button>
                <button onclick="selectQ(4)" id="q4" class="q-btn h-10 border rounded-xl font-bold text-xs">4분기</button>
            </div>
            <div id="m-wrap" class="flex gap-2 overflow-x-auto pb-2 mb-2"></div>
            <div id="w-wrap" class="flex gap-2 overflow-x-auto pb-2"></div>
        </header>

        <main id="list-container" class="p-5 space-y-4"></main>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAVvQNQaLlxu9Bp_vVGKNzkdN5QRN8n8-Y",
            authDomain: "fc-sujilove.firebaseapp.com",
            databaseURL: "https://fc-sujilove-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "fc-sujilove",
            storageBucket: "fc-sujilove.firebasestorage.app",
            messagingSenderId: "157843616872",
            appId: "1:157843616872:web:d9703b157d93166cb177dd"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let members = [];
        let currentQ = 1, currentM = 1, currentW = 1;
        let isDeleteMode = false;

        // 초기 전광판 데이터 리딩
        db.ref('schedule').on('value', snap => {
            const data = snap.val() || {};
            document.getElementById('view-loc').innerText = data.loc || '-';
            document.getElementById('view-time').innerText = data.time || '-';
            document.getElementById('view-opp').innerText = data.opp || '-';
        });

        function checkPassword() {
            if(document.getElementById('pw-input').value === '2025') {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('main-app').classList.remove('hidden');
                initAdmin();
            } else { alert("비밀번호가 틀렸습니다."); }
        }

        function initAdmin() {
            // fc_suji_v9 테이블에서 선수 목록 실시간 수신
            db.ref('fc_suji_v9').on('value', snap => {
                const val = snap.val();
                members = val ? Object.keys(val).map(id => ({id, ...val[id]})) : [];
                selectQ(1);
            });
        }

        function selectQ(q) {
            currentQ = q;
            document.querySelectorAll('.q-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('q'+q).classList.add('active');
            const months = { 1:[1,2,3], 2:[4,5,6], 3:[7,8,9], 4:[10,11,12] };
            document.getElementById('m-wrap').innerHTML = months[q].map(m => `
                <button onclick="selectM(${m})" id="m${m}" class="m-btn flex-none px-5 h-10 border rounded-xl font-bold text-xs bg-white">${m}월</button>
            `).join('');
            selectM(months[q][0]);
        }

        function selectM(m) {
            currentM = m;
            document.querySelectorAll('.m-btn').forEach(b => b.classList.remove('active'));
            if(document.getElementById('m'+m)) document.getElementById('m'+m).classList.add('active');
            document.getElementById('w-wrap').innerHTML = [1,2,3,4,5].map(w => `
                <button onclick="selectW(${w})" id="w${w}" class="w-btn flex-none px-4 h-9 border rounded-lg font-bold text-[11px] bg-white">${w}주차</button>
            `).join('');
            selectW(1);
        }

        function selectW(w) {
            currentW = w;
            document.querySelectorAll('.w-btn').forEach(b => b.classList.remove('active'));
            if(document.getElementById('w'+w)) document.getElementById('w'+w).classList.add('active');
            
            // 출석 데이터 리스너
            db.ref(`attendance/m${currentM}/w${currentW}`).on('value', snap => {
                renderList(snap.val() || {});
            });
        }

        function renderList(attendance) {
            const container = document.getElementById('list-container');
            
            // 포인트 계산 및 정렬
            let list = members.map(m => {
                const cur = attendance[m.id] || { a: 0, t: 0 };
                return { ...m, ...cur, total: (cur.a || 0) + (cur.t || 0) };
            }).sort((a, b) => b.total - a.total);

            container.innerHTML = list.map(m => {
                // 메달 로직 적용: 0~10 동, 11~20 은, 21~ 금
                let medal = "🥉"; 
                if(m.total > 20) medal = "🥇";
                else if(m.total > 10) medal = "🥈";

                return `
                <div class="member-card ${isDeleteMode ? 'delete-mode' : ''}">
                    <div class="flex items-center gap-3">
                        <button onclick="deleteMember('${m.id}', '${m.name}')" class="delete-btn text-red-500 font-bold mr-2">✕</button>
                        <span class="medal-icon">${medal}</span>
                        <div class="w-10 h-10 bg-emerald-100 rounded-xl flex items-center justify-center font-black text-emerald-700">${m.name[0]}</div>
                        <div>
                            <div class="font-black text-slate-800">${m.name}</div>
                            <div class="point-badge">Point: ${m.total}</div>
                        </div>
                    </div>
                    <div class="flex items-center gap-2">
                        <button onclick="updatePoint('${m.id}', 'a', ${m.a === 3 ? 0 : 3})" class="w-16 h-12 rounded-xl font-black text-[12px] ${m.a === 3 ? 'bg-blue-600 text-white' : 'bg-slate-100 text-slate-400'}">
                            ${m.a === 3 ? '참 석' : '미 참'}
                        </button>
                        <div class="flex flex-col items-center gap-1 bg-emerald-50 p-2 rounded-xl border border-emerald-100 min-w-[70px]">
                            <span class="text-[9px] font-black text-emerald-600">훈련(+1)</span>
                            <div class="flex items-center gap-2">
                                <button onclick="updatePoint('${m.id}', 't', ${(m.t || 0) - 1})" class="w-6 h-6 bg-white rounded shadow text-emerald-400 font-bold">-</button>
                                <span class="w-4 text-center font-black text-emerald-700 text-xs">${m.t || 0}</span>
                                <button onclick="updatePoint('${m.id}', 't', ${(m.t || 0) + 1})" class="w-6 h-6 bg-white rounded shadow text-emerald-600 font-bold">+</button>
                            </div>
                        </div>
                    </div>
                </div>`;
            }).join('');
        }

        function updatePoint(id, type, val) {
            db.ref(`attendance/m${currentM}/w${currentW}/${id}/${type}`).set(Math.max(0, val));
        }

        function addMember() {
            const name = prompt("새 선수 이름을 입력하세요:");
            if(name) db.ref('fc_suji_v9').push({ name, pos: '선수' });
        }

        function toggleDeleteMode() {
            isDeleteMode = !isDeleteMode;
            selectW(currentW); // 리렌더링
        }

        function deleteMember(id, name) {
            if(confirm(`[${name}] 선수를 명단에서 삭제할까요?`)) {
                db.ref(`fc_suji_v9/${id}`).remove();
            }
        }

        function toggleInputArea() { document.getElementById('input-area').classList.toggle('hidden'); }
        
        function saveSchedule() {
            const data = {
                date: document.getElementById('sched-date').value,
                loc: document.getElementById('sched-loc').value,
                time: document.getElementById('sched-time').value,
                opp: document.getElementById('sched-opp').value
            };
            db.ref('schedule').set(data).then(() => { alert("저장되었습니다."); toggleInputArea(); });
        }
    </script>
</body>
</html>
